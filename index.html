<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator || Demo</title>
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div class="text">
        <h1>
            UPDATE
            CALCULATOR
            XDXD
        </h1>
    </div>

    
    <div class="textdown">
        <p style="margin: 0;">
            by: <a href="https://t.me/ellayahx" class="no-underline">ellayah</a>, 
            <a href="https://t.me/xidizer" class="no-underline">xidize</a>, 
            <a href="https://t.me/moriyhj" class="no-underline"">atsumori</a> etc: tsum
        </p>
    </div>
   
    <div class="wrapper">
        <section class="screen">
            0
        </section>

        <section class="calc-buttons">
            <div class="calc-button-row">
                <button class="calc-button double">
                    C
                </button>
                <button class="calc-button">
                    &larr;
                </button>
                <button class="calc-button">
                    &divide;
                </button>
            </div>

            <div class="calc-button-row">
                <button class="calc-button">
                    7
                </button>
                <button class="calc-button">
                    8
                </button>
                <button class="calc-button">
                    9
                </button>
                <button class="calc-button">
                    &times;
                </button>
            </div>

            <div class="calc-button-row">
                <button class="calc-button">
                    4
                </button>
                <button class="calc-button">
                    5
                </button>
                <button class="calc-button">
                    6
                </button>
                <button class="calc-button">
                    &minus;
                </button>
            </div>

            <div class="calc-button-row">
                <button class="calc-button">
                    1
                </button>
                <button class="calc-button">
                    2
                </button>
                <button class="calc-button">
                    3
                </button>
                <button class="calc-button">
                    &plus;
                </button>
            </div>

            <div class="calc-button-row">
                <button class="calc-button triple">
                    0
                </button>
                <button class="calc-button">
                    &equals;
                </button>
            </div>



        </section>
   </div> 


    <script src="script.js"></script>
</body>
</html>
